<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GorIlliaPanel</title>

<style>
:root{
  --bg:#0b0f14;
  --surface:#141b22;
  --surface2:#10161d;
  --border:#243041;
  --text:#f3f4f6;
  --muted:#94a3b8;
  --green:#22c55e;
  --gold:#f59e0b;
  --red:#ef4444;
  --blue:#3b82f6;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(11,15,20,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:18px 24px;
}

.headerRow{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

h1{
  margin:0;
  font-size:34px;
}

.sub{
  margin-top:6px;
  color:var(--muted);
}

.grid{
  padding:24px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:18px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:20px;
  cursor:pointer;
  transition:.16s ease;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#3b4b61;
}

.name{
  font-size:26px;
  font-weight:800;
}

.clientId{
  margin-top:4px;
  color:var(--muted);
}

.plan{
  margin-top:14px;
  color:#dbeafe;
  font-size:17px;
}

.quick{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quickBox{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
}

.quickLabel{
  color:var(--muted);
  font-size:12px;
}

.quickValue{
  margin-top:6px;
  font-size:20px;
  font-weight:800;
}

.alerts{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.alert{
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.alert.red{
  background:rgba(239,68,68,.15);
  color:#fecaca;
}

.alert.gold{
  background:rgba(245,158,11,.15);
  color:#fde68a;
}

.alert.green{
  background:rgba(34,197,94,.15);
  color:#bbf7d0;
}

.panel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.66);
  backdrop-filter:blur(6px);
  display:none;
  z-index:100;
}

.panel.open{
  display:block;
}

.panelContent{
  position:absolute;
  top:0;
  right:0;
  width:min(1100px,100%);
  height:100%;
  overflow:auto;
  background:#0f141b;
  border-left:1px solid var(--border);
  padding:24px;
}

.close{
  background:#1d2631;
  border:1px solid var(--border);
  color:white;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}

.summary{
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.summaryBox{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
}

.section{
  margin-top:28px;
}

.section h2{
  margin:0 0 14px;
  font-size:24px;
}

.timeline{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.dot{
  width:18px;
  height:18px;
  border-radius:999px;
  background:#1f2937;
}

.dot.done{
  background:var(--green);
}

.dot.partial{
  background:var(--gold);
}

.tableWrap{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

th{
  position:sticky;
  top:0;
  background:#10161d;
  color:#cbd5e1;
  text-align:left;
  font-size:12px;
  letter-spacing:.04em;
}

th,td{
  padding:12px 14px;
  border-bottom:1px solid #1f2937;
}

td{
  font-size:14px;
}

tr:hover{
  background:#121923;
}

.exercise{
  font-weight:700;
}

.sheetBtn{
  display:inline-block;
  margin-top:18px;
  text-decoration:none;
  background:var(--blue);
  color:white;
  padding:12px 16px;
  border-radius:14px;
  font-weight:700;
}

.loading{
  padding:24px;
  color:var(--muted);
}

.error{
  padding:24px;
  color:#fecaca;
}
</style>
</head>

<body>

<header>
  <div class="headerRow">
    <div>
      <h1>🦍 GorIlliaPanel</h1>
      <div class="sub">
        Dashboard trenera · analiza danych MonkeyPanel
      </div>
    </div>
  </div>
</header>

<div id="dashboard" class="grid">
  <div class="loading">
    Ładowanie klientów...
  </div>
</div>

<div id="panel" class="panel">
  <div class="panelContent">
    <button class="close" onclick="closePanel()">
      Zamknij
    </button>

    <div id="panelBody"></div>
  </div>
</div>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbx6AQ6v382RXmr6YdisKN5YgKSyTZ35pOE-tR0jhh827Dxvp3EfsT1fZnm31Hu98hY/exec';

const monkeyUrl =
'https://torgunidas.github.io/MonkeyPanel/';

const state = {
  clients:[]
};

async function boot(){

  const dashboard =
    document.getElementById('dashboard');

  try{

    const healthRes =
      await fetch(API_URL + '?action=health');

    const health =
      await healthRes.json();

    const clients =
      health.clients || [];

    const enriched =
      await Promise.all(
        clients.map(loadClient)
      );

    state.clients = enriched;

    dashboard.innerHTML =
      enriched.map(renderCard).join('');

  }catch(err){

    dashboard.innerHTML =
      '<div class="error">' +
      err +
      '</div>';
  }
}

async function loadClient(client){

  const workoutRes =
    await fetch(
      API_URL +
      '?action=getWorkoutLog&client=' +
      encodeURIComponent(client.clientId)
    );

  const measurementRes =
    await fetch(
      API_URL +
      '?action=getMeasurements&client=' +
      encodeURIComponent(client.clientId)
    );

  const workout =
    await workoutRes.json();

  const measurements =
    await measurementRes.json();

  return {
    ...client,
    workout,
    measurements
  };
}

function renderCard(client){

  const statuses =
    client.workout.statuses || [];

  const logs =
    client.workout.logs || [];

  const measurements =
    client.measurements.measurements || [];

  const completed =
    statuses.filter(s =>
      s.status === 'done' ||
      s.status === 'done_with_skips'
    ).length;

  const last =
    statuses.length
      ? statuses[statuses.length - 1]
      : null;

  const lastWeight =
    measurements.length
      ? measurements[measurements.length - 1].Waga
      : '-';

  const alerts = [];

  if(logs.some(r =>
    String(r.planned_label || '')
      .includes('POMINIĘTE')
  )){
    alerts.push({
      text:'Skipy',
      cls:'gold'
    });
  }

  if(logs.some(r =>
    r.done &&
    !r.rpe &&
    r.exercise_no !== 'NOTE'
  )){
    alerts.push({
      text:'Brak RPE',
      cls:'red'
    });
  }

  if(!alerts.length){
    alerts.push({
      text:'Brak alertów',
      cls:'green'
    });
  }

  return `
    <div class="card"
      onclick="openClient('${client.clientId}')">

      <div class="name">
        ${client.clientName || client.clientId}
      </div>

      <div class="clientId">
        ${client.clientId}
      </div>

      <div class="plan">
        ${client.activePlanId || '-'}
      </div>

      <div class="quick">

        <div class="quickBox">
          <div class="quickLabel">
            Ostatni trening
          </div>

          <div class="quickValue">
            ${last?.workout_date || '-'}
          </div>
        </div>

        <div class="quickBox">
          <div class="quickLabel">
            Postęp
          </div>

          <div class="quickValue">
            W${last?.week || '-'}
            T${last?.workout_id || '-'}
          </div>
        </div>

        <div class="quickBox">
          <div class="quickLabel">
            Treningi
          </div>

          <div class="quickValue">
            ${completed}
          </div>
        </div>

        <div class="quickBox">
          <div class="quickLabel">
            Waga
          </div>

          <div class="quickValue">
            ${lastWeight || '-'}
          </div>
        </div>

      </div>

      <div class="alerts">
        ${alerts.map(a => `
          <div class="alert ${a.cls}">
            ${a.text}
          </div>
        `).join('')}
      </div>

    </div>
  `;
}

function openClient(clientId){

  const client =
    state.clients.find(c =>
      c.clientId === clientId
    );

  if(!client) return;

  const panel =
    document.getElementById('panel');

  const body =
    document.getElementById('panelBody');

  const statuses =
    client.workout.statuses || [];

  const logs =
    client.workout.logs || [];

  const measurements =
    client.measurements.measurements || [];

  const completed =
    statuses.filter(s =>
      s.status === 'done' ||
      s.status === 'done_with_skips'
    ).length;

  const timeline =
    statuses.slice(-30).map(s => `
      <div class="dot ${s.status.includes('done') ? 'done' : 'partial'}"></div>
    `).join('');

  const recentLogs =
    logs.slice(-60).reverse();

  body.innerHTML = `

    <h1>
      ${client.clientName || client.clientId}
    </h1>

    <div class="sub">
      ${client.activePlanId || '-'}
    </div>

    <div class="summary">

      <div class="summaryBox">
        <div class="quickLabel">
          Wykonane treningi
        </div>

        <div class="quickValue">
          ${completed}
        </div>
      </div>

      <div class="summaryBox">
        <div class="quickLabel">
          Ostatni trening
        </div>

        <div class="quickValue">
          ${statuses.length
            ? statuses[statuses.length - 1].workout_date
            : '-'}
        </div>
      </div>

      <div class="summaryBox">
        <div class="quickLabel">
          Ostatnia waga
        </div>

        <div class="quickValue">
          ${measurements.length
            ? measurements[measurements.length - 1].Waga
            : '-'}
        </div>
      </div>

    </div>

    <div class="section">
      <h2>Aktywność</h2>

      <div class="timeline">
        ${timeline}
      </div>
    </div>

    <div class="section">
      <h2>Ostatnie serie</h2>

      <div class="tableWrap">

        <table>

          <thead>
            <tr>
              <th>Data</th>
              <th>Ćwiczenie</th>
              <th>KG</th>
              <th>Reps</th>
              <th>RPE</th>
              <th>Notatka</th>
            </tr>
          </thead>

          <tbody>

            ${recentLogs.map(r => `
              <tr>
                <td>${r.workout_date || '-'}</td>

                <td class="exercise">
                  ${r.exercise_name || '-'}
                </td>

                <td>
                  ${r.kg || '-'}
                </td>

                <td>
                  ${r.reps || '-'}
                </td>

                <td>
                  ${r.rpe || '-'}
                </td>

                <td>
                  ${r.note || '-'}
                </td>
              </tr>
            `).join('')}

          </tbody>

        </table>

      </div>

      <a class="sheetBtn"
        target="_blank"
        href="${client.spreadsheetUrl || '#'}">

        Otwórz Google Sheets
      </a>

      <a class="sheetBtn"
        target="_blank"
        href="${monkeyUrl}?client=${encodeURIComponent(client.clientId)}">

        Otwórz MonkeyPanel
      </a>

    </div>
  `;

  panel.classList.add('open');
}

function closePanel(){
  document
    .getElementById('panel')
    .classList
    .remove('open');
}

boot();
</script>

</body>
</html>
