<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GorIlliaPanel</title>

<style>
:root{
  --bg:#0b0f14;
  --card:#141b22;
  --border:#263241;
  --text:#f3f4f6;
  --muted:#94a3b8;
  --green:#22c55e;
  --gold:#f59e0b;
  --red:#ef4444;
  --blue:#3b82f6;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,15,20,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:20px 24px;
}

h1{
  margin:0;
  font-size:34px;
}

.sub{
  margin-top:6px;
  color:var(--muted);
}

main{
  padding:24px;
  display:grid;
  gap:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:26px;
  padding:22px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
}

.name{
  font-size:28px;
  font-weight:800;
}

.clientId{
  margin-top:4px;
  color:var(--muted);
}

.plan{
  margin-top:14px;
  font-size:18px;
  color:#dbeafe;
}

.stats{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:12px;
}

.stat{
  background:#0f141b;
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
}

.label{
  color:var(--muted);
  font-size:13px;
}

.value{
  margin-top:6px;
  font-size:22px;
  font-weight:800;
}

.alerts{
  margin-top:18px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.alert{
  padding:8px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
}

.alert.red{
  background:rgba(239,68,68,.14);
  color:#fca5a5;
}

.alert.gold{
  background:rgba(245,158,11,.14);
  color:#fde68a;
}

.alert.green{
  background:rgba(34,197,94,.14);
  color:#86efac;
}

.actions{
  margin-top:20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  text-decoration:none;
  background:var(--blue);
  color:white;
  padding:12px 16px;
  border-radius:14px;
  font-weight:700;
}

.loading{
  color:var(--muted);
}

.error{
  color:#fca5a5;
}

.footer{
  padding:20px 24px 40px;
  color:var(--muted);
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🦍 GorIlliaPanel</h1>
  <div class="sub">
    Read-only dashboard trenera · MonkeyPanel ecosystem
  </div>
</header>

<main id="app">
  <div class="loading">
    Ładowanie klientów...
  </div>
</main>

<div class="footer">
  Google Sheets pozostaje source of truth.
</div>

<script>
const API_URL =
'https://script.google.com/macros/s/AKfycbx6AQ6v382RXmr6YdisKN5YgKSyTZ35pOE-tR0jhh827Dxvp3EfsT1fZnm31Hu98hY/exec';

async function boot(){

  const app =
    document.getElementById('app');

  try{

    const healthRes =
      await fetch(API_URL + '?action=health');

    const health =
      await healthRes.json();

    const clients =
      health.clients || [];

    if(!clients.length){

      app.innerHTML =
        '<div class="card">Brak klientów w CLIENT_INDEX</div>';

      return;
    }

    const cards =
      await Promise.all(
        clients.map(loadClientData)
      );

    app.innerHTML =
      cards.join('');

  }catch(err){

    app.innerHTML =
      '<div class="card error">Błąd ładowania dashboardu<br><br>' +
      err +
      '</div>';
  }
}

async function loadClientData(client){

  try{

    const logRes =
      await fetch(
        API_URL +
        '?action=getWorkoutLog&client=' +
        encodeURIComponent(client.clientId)
      );

    const logData =
      await logRes.json();

    const measurementRes =
      await fetch(
        API_URL +
        '?action=getMeasurements&client=' +
        encodeURIComponent(client.clientId)
      );

    const measurementData =
      await measurementRes.json();

    return renderClientCard(
      client,
      logData,
      measurementData
    );

  }catch(err){

    return `
      <div class="card">
        <div class="name">
          ${client.clientName || client.clientId}
        </div>

        <div class="clientId">
          ${client.clientId}
        </div>

        <div class="error" style="margin-top:16px">
          Nie udało się pobrać danych klienta
        </div>
      </div>
    `;
  }
}

function renderClientCard(
  client,
  logData,
  measurementData
){

  const statuses =
    logData.statuses || [];

  const logs =
    logData.logs || [];

  const measurements =
    measurementData.measurements || [];

  const completedWorkouts =
    statuses.filter(s =>
      s.status === 'done' ||
      s.status === 'done_with_skips'
    ).length;

  const lastStatus =
    statuses.length
      ? statuses[statuses.length - 1]
      : null;

  const skipped =
    logs.some(r =>
      String(r.planned_label || '')
        .includes('POMINIĘTE')
    );

  const missingRpe =
    logs.some(r =>
      r.done &&
      !r.rpe &&
      r.exercise_no !== 'NOTE'
    );

  const alerts = [];

  if(skipped){
    alerts.push({
      text:'Pominięte ćwiczenia',
      cls:'gold'
    });
  }

  if(missingRpe){
    alerts.push({
      text:'Brak RPE',
      cls:'red'
    });
  }

  if(!alerts.length){
    alerts.push({
      text:'Brak alertów',
      cls:'green'
    });
  }

  const latestMeasurement =
    measurements.length
      ? measurements[measurements.length - 1]
      : null;

  const alertHtml =
    alerts.map(a => `
      <div class="alert ${a.cls}">
        ${a.text}
      </div>
    `).join('');

  return `
    <div class="card">

      <div class="top">

        <div>
          <div class="name">
            ${client.clientName || client.clientId}
          </div>

          <div class="clientId">
            ${client.clientId}
          </div>

          <div class="plan">
            ${client.activePlanId || '-'}
          </div>
        </div>

      </div>

      <div class="stats">

        <div class="stat">
          <div class="label">
            Ostatni trening
          </div>

          <div class="value">
            ${lastStatus
              ? lastStatus.workout_date || '-'
              : '-'}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Postęp
          </div>

          <div class="value">
            W${lastStatus?.week || '-'}
            T${lastStatus?.workout_id || '-'}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Wykonane treningi
          </div>

          <div class="value">
            ${completedWorkouts}
          </div>
        </div>

        <div class="stat">
          <div class="label">
            Ostatnia waga
          </div>

          <div class="value">
            ${latestMeasurement?.Waga || '-'}
          </div>
        </div>

      </div>

      <div class="alerts">
        ${alertHtml}
      </div>

      <div class="actions">

        <a class="btn"
          target="_blank"
          href="https://torgunidas.github.io/MonkeyPanel/?client=${encodeURIComponent(client.clientId)}">
          Otwórz MonkeyPanel
        </a>

      </div>

    </div>
  `;
}

boot();
</script>

</body>
</html>
