/* v0.36 — Studio */
:root{
  --app-bg:#eeeeea;
  --card:#fff;
  --card-alt:#fbfbfa;
  --card-head:#f7f7f4;
  --ink:#232629;
  --ink-2:#4d535c;
  --muted:#888d95;
  --faint:#a2a6ad;
  --line:#e7e7e2;
  --line-soft:#eeeee9;
  --row-line:#f2f2ee;
  --accent:#4e7a5e;
  --accent-soft:#e5ede7;
  --accent-line:#cbded2;
  --accent-ink:#3c6450;
  --warn-soft:#f5efe1;
  --warn-line:#e7d8b9;
  --warn-ink:#8a6d2e;
  --info-soft:#eaf0f3;
  --info-line:#cfdee6;
  --info-ink:#3a6a82;
  --radius-card:11px;
  --radius-ctrl:8px;
  --shadow:0 12px 40px rgba(35,38,41,.08);
}
html{background:var(--app-bg);scrollbar-gutter:stable}
body{background:var(--app-bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.42}
button,input,select,textarea{font-family:inherit}
button{color:inherit}
.logo,.title,.sectionTitle,.planCardTitle,.progressExerciseTitle,.historyTitle,.metricValue,.athleteHeroTitle,.trainingNameInput{font-family:Archivo,"Public Sans",sans-serif}
.app{display:block;min-height:100vh}
.globalTopNav{height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:0 28px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:none;position:sticky;top:0;z-index:30}
.brandBlock{display:flex;align-items:baseline;gap:9px;min-width:220px}
.logo{font-size:17px;font-weight:700;letter-spacing:-.02em}
.version{font-size:11.5px;font-weight:500;color:var(--muted)}
.nav{display:flex;align-self:stretch;gap:28px}
.nav button{position:relative;display:flex;align-items:center;border:0;background:transparent;border-radius:0;padding:0 2px;color:var(--muted);font-size:13px;font-weight:600;min-height:54px}
.nav button::before{display:none}
.nav button:hover{background:transparent;color:var(--ink)}
.nav button.active{background:transparent;color:var(--ink);font-weight:700}
.nav button.active::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:3px;border-radius:3px;background:var(--accent)}
.trainerAvatar{justify-self:end;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#eff2ef;border:1px solid #dfe4df;color:var(--accent);font-size:11px;font-weight:700}
.main{width:100%;max-width:1540px;margin:0 auto;padding:27px 28px 64px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px}
.studioTopbar{min-height:76px}
.eyebrow{color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.title{margin-top:2px;color:var(--ink);font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
.screenMeta{margin-top:3px;color:var(--muted);font-size:12px}
.status{margin-top:7px;color:var(--muted);font-size:11px;font-weight:500}
.status::before{width:6px;height:6px}
.status.ok{color:var(--accent)}
.status.ok::before{background:var(--accent)}
.status.loading{color:var(--warn-ink)}
.status.loading::before{background:#c5902f}
.status.err{color:#a1493d}
.topbarActions{display:flex;align-items:center;gap:10px}
.searchField{min-width:260px;height:38px;display:flex;align-items:center;gap:7px;padding:0 11px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-ctrl);color:var(--faint)}
.searchField input{height:36px;min-height:0;padding:0;border:0;background:transparent;box-shadow:none;font-size:13px}
.searchField input:focus{border:0;box-shadow:none}
.searchField span{font-size:17px;line-height:1}
.btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border:1px solid var(--ink);border-radius:var(--radius-ctrl);background:var(--ink);color:#fff;font-family:"Public Sans",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:0;box-shadow:none}
.btn:hover{transform:none;filter:brightness(.97)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.secondary:hover{background:var(--card);border-color:#d7d7d1}
.btn.good{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:transparent;color:#9a5148;border-color:#eadad7}
.btn.danger:hover{background:#fbf3f2}
.btnRow{gap:9px}
input,select,textarea{min-height:36px;padding:7px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-ctrl);color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums;outline:none}
textarea{min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:disabled{background:var(--card-alt);color:var(--muted)}
.field label{margin-bottom:5px;color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.section,.training,.progressExerciseCard,.weekNotesPanel,.historyPanel,.metricCard,.previewShell,.clientWorkout,.planRow,.previewPicker,.athleteHero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:none}
.section{padding:17px 18px;margin-bottom:14px}
.sectionTitle{margin-bottom:11px;color:var(--ink);font-size:15px;font-weight:700}
.small,.muted{color:var(--muted);font-size:12px}
.note,.athleteNote{padding:10px 13px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:9px;color:var(--accent-ink);font-size:12.5px}
.empty,.emptyWeek,.panelNotice{padding:22px;background:transparent;border:1.5px dashed #d8d8d0;border-radius:var(--radius-card);color:var(--muted);text-align:center}
.pill{display:inline-flex;align-items:center;margin:0;padding:3px 10px;border-radius:999px;background:var(--card-alt);border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:600;line-height:1.15}
.pill.good{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
.pill.blue{background:var(--info-soft);border-color:var(--info-line);color:var(--info-ink)}
.pill.neutral{background:#f2f2ef;border-color:#e2e2dc;color:#6d727a}

/* Plans */
.planCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.planCard{min-height:172px;display:flex;flex-direction:column;align-items:stretch;padding:17px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);text-align:left;transition:border-color .12s ease,transform .12s ease}
.planCard:hover{transform:translateY(-1px);border-color:#d8ddd8;box-shadow:none}
.planCardOpen{display:block;width:100%;flex:1;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.planCardTitle{margin-top:13px;color:var(--ink);font-size:16px;font-weight:700;letter-spacing:-.015em}
.planCardMeta{margin-top:7px;color:var(--muted);font-size:12.5px}
.planCardFooter{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:13px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:11.5px}
.planPeople{display:flex;align-items:center;gap:8px;min-width:0}
.planCardActions{display:flex;align-items:center;gap:4px;margin-left:10px}
.planCardActions button{padding:4px 7px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer}
.planCardActions button:hover{background:var(--card-head);color:var(--ink)}
.planCardActions button.danger:hover{background:#fbf3f2;color:#9a5148}
.avatarStack{display:flex;align-items:center}
.avatarStack .avatar+.avatar{margin-left:-6px}
.avatar{flex:0 0 auto;display:inline-grid;place-items:center;border-radius:50%;background:#dce7df;color:var(--accent-ink);font-weight:700}
.avatar-xs{width:23px;height:23px;border:2px solid var(--card);font-size:8px}
.avatar-sm{width:34px;height:34px;font-size:10px}
.avatar-lg{width:49px;height:49px;font-size:16px}
.avatar-more{background:#e8e7e1;color:#72767d}
.planCard.new{align-items:center;justify-content:center;gap:7px;background:transparent;border:1.5px dashed #d8d8d0;color:var(--muted);font-family:"Public Sans",sans-serif;font-size:12px;cursor:pointer}
.planCard.new strong{font-size:13px;font-weight:600}
.newPlus{color:var(--accent);font-size:22px;line-height:1}

/* Builder */
.builderTopbar{margin-bottom:12px}
.builderNav{display:flex;align-items:flex-start;gap:14px;height:43px;min-height:43px;margin:0 0 20px;padding:0;border:0;border-bottom:1px solid var(--line);background:transparent;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.builderNav::-webkit-scrollbar{display:none}
.builderStep,.tab{position:relative;flex:0 0 auto;width:auto;height:42px;min-height:42px;padding:9px 14px 11px;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600}
.builderStep:hover,.tab:hover{background:transparent;color:var(--ink)}
.builderStep.active,.tab.active{background:transparent;color:var(--ink);font-weight:700}
.builderStep.active::after,.tab.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}
.builderNav .builderStep.active::after{bottom:0}
.builderStepNo{display:none}
.builderActions{justify-content:flex-end}
.builderSection{min-width:0}
.training{overflow:auto;margin-bottom:14px}
.trainingHead{min-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) auto auto 30px;align-items:center;gap:10px;padding:11px 13px;background:var(--card);border-bottom:1px solid var(--line)}
.trainingIdentity{display:flex;align-items:center;gap:12px}
.trainingNameInput,.trainingFocusInput{width:auto;min-height:28px;padding:2px 6px;border:0;box-shadow:none;background:transparent}
.trainingNameInput{max-width:260px;font-size:14.5px;font-weight:700}
.trainingFocusInput{min-width:260px;color:var(--muted);font-size:12px}
.trainingNameInput:focus,.trainingFocusInput:focus{border:0;box-shadow:0 0 0 2px var(--accent-soft)}
.trainingCount{color:var(--muted);font-size:11.5px}
.trainingDelete{opacity:.5}
.exerciseGrid{min-width:1180px;grid-template-columns:96px minmax(220px,1.3fr) 64px 78px 82px 86px 78px 144px 86px 104px 28px;gap:7px;padding:7px 13px;border-top:1px solid var(--row-line);align-items:center;font-variant-numeric:tabular-nums}
.exerciseGrid.header{padding-top:8px;padding-bottom:8px;background:var(--card-alt);color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.exerciseGrid:not(.header):hover{background:#fafbf9}
.exerciseGrid.dragging{opacity:.5}
.exerciseGrid.dropBefore{box-shadow:inset 0 3px 0 var(--accent)}
.exerciseGrid.dropAfter{box-shadow:inset 0 -3px 0 var(--accent)}
.exerciseGrid input,.exerciseGrid select{min-height:30px;padding:4px 7px;border-color:transparent;background:transparent}
.exerciseGrid input:hover,.exerciseGrid select:hover,.exerciseGrid input:focus,.exerciseGrid select:focus{background:var(--card);border-color:var(--line)}
.exerciseName{font-size:12.5px;font-weight:600}
.exerciseNoteInput{display:block;width:100%;margin-top:2px;color:var(--muted);font-size:11px}
.exerciseOrderCell{display:grid;grid-template-columns:24px 32px 24px;align-items:center;justify-content:start;gap:4px}
.exerciseDragHandle,.exerciseMoveButton{display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--faint);cursor:pointer}
.exerciseDragHandle{width:24px;height:30px;font-size:16px;line-height:1;cursor:grab}
.exerciseDragHandle:active{cursor:grabbing}
.exerciseDragHandle:hover,.exerciseMoveButton:hover{border-color:var(--line);background:var(--card-alt);color:var(--ink)}

<script>
const SUPABASE_URL = "https://matuflemwleglsrzrlkp.supabase.co";
const SUPABASE_KEY = "sb_publishable_D1z2s-S-GrnWH9u9D8P1nA_H3T9W7hF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =========================
   STATE
========================= */
const STATE = {
  screen:"plans",
  tab:"structure",
  plans:[],
  exercises:[],
  athletes:[],
  athletePlanLinks:[],
  selectedAthleteId:null,
  athleteTab:"profile",
  athletePreview:null,
  selectedWorkoutSessionId:null,
  previewWeek:1,

  assignedAthletes:[],
  trainings:[],
  trainingExercises:[],
  blocks:[],
  activeBlockId:null,
  progressionExercises:[],
  progressionSets:[],
  weekNotes:[],
  resources:[],
  supersetSelection:{},
  draggedExerciseId:null,
  planQuery:"",
  athleteQuery:"",
  exerciseQuery:"",
  exerciseCategory:"all",
  dirty:false,
  saving:false,
  statusText:"Ładowanie Supabase...",
  statusKind:"loading",
  lastError:""
};

const BUILDER_STEPS = [
  {id:"overview",label:"Ustawienia"},
  {id:"structure",label:"Treningi"},
  {id:"progression",label:"Progresja"},
  {id:"resources",label:"Materiały"}
];

// Small shared helpers used across render and data flows.
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function norm(s){return String(s??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l").replace(/[^a-z0-9]+/g," ").trim();}
function money(v){return v===null||v===undefined?"":String(v).replace(/\.00$/,"");}
function nullableNumber(v){if(v===""||v===null||v===undefined)return null;const n=Number(String(v).replace(",","."));return Number.isFinite(n)?n:null;}
function setStatus(text,kind="ok"){STATE.statusText=text;STATE.statusKind=kind;}
function setError(err){console.error(err);STATE.lastError=err?.message||String(err);setStatus("Błąd", "err");render();}
function markDirty(){STATE.dirty=true;document.querySelectorAll("[data-dirty]").forEach(el=>el.classList.toggle("warn",true));}
function showToast(text){const el=document.createElement("div");el.className="toast";el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function tempId(){return `tmp_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;}
function slugify(name){return norm(name).replace(/\s+/g,"_")||"plan";}
function statusHTML(){return `<div class="status ${STATE.statusKind}">${esc(STATE.statusText)}</div>${STATE.lastError?`<div class="note" style="color:#fecaca;border-color:#7f1d1d;background:#190707;margin-top:10px">${esc(STATE.lastError)}</div>`:""}`;}

/* =========================
   DATA LOADERS
========================= */
async function init(){
  try{
    await Promise.all([loadPlans(),loadExercises(),loadAthletes()]);
    await loadAthleteAssignments();
    setStatus("Połączono z Supabase","ok");
    render();
  }catch(err){setError(err);}
}

async function loadPlans(){
  const {data,error}=await sb.from("plans").select("id,slug,name,start_date,weeks,status,notes,created_at,imported_at").order("created_at",{ascending:false});
  if(error)throw error; STATE.plans=data||[];
}
async function loadExercises(){
  const {data,error}=await sb.from("exercises").select("id,name,youtube_url,notes,default_mode,default_category,archived_at,archived_reason").is("archived_at",null).order("name");
  if(error)throw error; STATE.exercises=data||[];
}
async function loadAthletes(){
  const {data,error}=await sb.from("athletes").select("id,client_key,name,status,notes").order("name");
  if(error)throw error; STATE.athletes=data||[];
}
async function loadAthleteAssignments(){
  const {data,error}=await sb.from("plan_athletes").select("plan_id,athlete_id,assigned_at,plans(id,slug,name,start_date,weeks,status,notes,created_at,published_at),athletes(id,client_key,name,status)").order("assigned_at",{ascending:false});
  if(error)throw error; STATE.athletePlanLinks=data||[];
}
async function loadPlan(id){
  setStatus("Ładowanie planu...","loading");render();
  try{
    STATE.currentPlan=STATE.plans.find(p=>p.id===id)||null;
    if(!STATE.currentPlan)throw new Error("Nie znaleziono planu");
    const [pa,tr,blocks,res]=await Promise.all([
      sb.from("plan_athletes").select("athletes(id,client_key,name,status)").eq("plan_id",id),
      sb.from("trainings").select("id,plan_id,name,focus,order_index,source_row").eq("plan_id",id).order("order_index"),
      sb.from("progression_blocks").select("id,plan_id,name,block_index,start_week,end_week,notes").eq("plan_id",id).order("block_index"),
      sb.from("plan_resources").select("id,plan_id,label,url,resource_type,notes").eq("plan_id",id).order("created_at")
    ]);
    if(pa.error)throw pa.error;if(tr.error)throw tr.error;if(blocks.error)throw blocks.error;if(res.error)throw res.error;
    STATE.assignedAthletes=(pa.data||[]).map(x=>x.athletes).filter(Boolean);
    STATE.trainings=tr.data||[];
    STATE.blocks=blocks.data||[];
    if(!STATE.blocks.some(b=>b.id===STATE.activeBlockId))STATE.activeBlockId=STATE.blocks[0]?.id||null;
    STATE.resources=res.data||[];
    const trainingIds=STATE.trainings.map(t=>t.id);
    if(trainingIds.length){
      const te=await sb.from("training_exercises").select("id,training_id,exercise_id,exercise_no,order_index,sets_text,reps_text,rest_text,weight,load_text,tempo_text,use_wg,progression_mode,superset_key,group_label,mode,notes,video_hint,progression_raw,exercises(id,name,youtube_url,default_mode,default_category)").in("training_id",trainingIds).order("order_index");
      if(te.error)throw te.error; STATE.trainingExercises=te.data||[];
    }else STATE.trainingExercises=[];
    const blockIds=STATE.blocks.map(b=>b.id);
    if(blockIds.length){
      const [pe,wn]=await Promise.all([
        sb.from("progression_exercises").select("id,block_id,exercise_id,training_exercise_id,order_index,notes,source_name,exercises(id,name)").in("block_id",blockIds).order("order_index"),
        sb.from("progression_week_notes").select("id,block_id,week_number,notes").in("block_id",blockIds).order("week_number")
      ]);
      if(pe.error)throw pe.error;if(wn.error)throw wn.error;
      STATE.progressionExercises=pe.data||[];
      STATE.weekNotes=wn.data||[];
      const peIds=STATE.progressionExercises.map(x=>x.id);
      if(peIds.length){
        const ps=await sb.from("progression_sets").select("id,progression_exercise_id,week_number,set_no,label,reps_text,kg,raw_text,load_text,set_count,is_skip,is_deload,rest_text,notes,prescription").in("progression_exercise_id",peIds).order("week_number");
        if(ps.error)throw ps.error; STATE.progressionSets=ps.data||[];
      }else STATE.progressionSets=[];
      absorbStatusSetsIntoWeekNotes();
    }else{STATE.progressionExercises=[];STATE.progressionSets=[];STATE.weekNotes=[];}
    const structure=normalizeAllTrainingStructures({detectLegacy:true});
    STATE.screen="builder";STATE.tab="structure";STATE.supersetSelection={};STATE.dirty=structure.changed;STATE.lastError="";
    setStatus(structure.legacyMigrated?"Wykryto starsze superserie — zapisz plan, aby je ujednolicić":structure.changed?"Kolejność została uporządkowana — zapisz plan":"Plan załadowany","ok");
    render();
  }catch(err){setError(err);}
}

async function reloadAll(){
  try{
    await Promise.all([loadPlans(),loadExercises(),loadAthletes()]);
    await loadAthleteAssignments();
    if(STATE.currentPlan)await loadPlan(STATE.currentPlan.id);

}

/* =========================
   SELECTORS
========================= */
function getCurrentPlan(){
  return STATE.currentPlan;
}

function getTrainingRows(trainingId){
  return STATE.trainingExercises
    .filter(row=>row.training_id===trainingId)
    .sort((a,b)=>(Number(a.order_index)||0)-(Number(b.order_index)||0)||String(a.id).localeCompare(String(b.id)));
}

function supersetKey(row){
  return String(row?.superset_key||"").trim().toLowerCase();
}

function supersetMemberCode(index){
  let value=Math.max(0,Number(index)||0)+1,label="";
  while(value>0){
    value--;
    label=String.fromCharCode(65+(value%26))+label;
    value=Math.floor(value/26);
  }
  return label;
}

function legacyExerciseNumber(value){
  const match=String(value||"").trim().toLowerCase().match(/^(\d+)([a-z])?$/);
  return match?{base:match[1],suffix:match[2]||""}:null;
}

function migrateLegacySupersets(rows){
  const candidates=new Map();
  rows.forEach(row=>{
    if(supersetKey(row)||(row.mode||"sets")!=="sets")return;
    const parsed=legacyExerciseNumber(row.exercise_no);
    if(!parsed)return;
    if(!candidates.has(parsed.base))candidates.set(parsed.base,[]);
    candidates.get(parsed.base).push({row,suffix:parsed.suffix});
  });
  const used=new Set(rows.map(supersetKey).filter(Boolean));
  let changed=false;
  candidates.forEach((members,base)=>{
    if(members.length<2||!members.some(member=>member.suffix))return;
    let key=`legacy_${base}`,number=2;
    while(used.has(key))key=`legacy_${base}_${number++}`;
    used.add(key);
    members.forEach(({row})=>{row.superset_key=key;changed=true});
  });
  return changed;
}

function exerciseUnits(rows){
  const ordered=[...rows].sort((a,b)=>(Number(a.order_index)||0)-(Number(b.order_index)||0)||String(a.id).localeCompare(String(b.id)));
  const grouped=new Map();
  ordered.forEach(row=>{
    const key=supersetKey(row);
    if(key){
      if(!grouped.has(key))grouped.set(key,[]);
      grouped.get(key).push(row);
    }
  });
  const seen=new Set(),units=[];
  ordered.forEach(row=>{
    const key=supersetKey(row);
    if(!key){units.push([row]);return}
    if(seen.has(key))return;
    seen.add(key);
    units.push(grouped.get(key)||[row]);
  });
  return units;
}

function normalizeExerciseRows(rows,{detectLegacy=false}={}){
  const before=new Map(rows.map(row=>[row.id,JSON.stringify([row.order_index,row.exercise_no,row.superset_key,row.group_label])]));
  const legacyMigrated=detectLegacy&&migrateLegacySupersets(rows);
  const counts=new Map();
  rows.forEach(row=>{const key=supersetKey(row);if(key)counts.set(key,(counts.get(key)||0)+1)});
  rows.forEach(row=>{
    const key=supersetKey(row);
    if(key&&(counts.get(key)||0)<2){row.superset_key=null;row.group_label=null}
    else if(key)row.superset_key=key;
  });
  const units=exerciseUnits(rows);
  let order=0,supersetNo=0;
  units.forEach((unit,unitIndex)=>{
    const grouped=unit.length>1&&Boolean(supersetKey(unit[0]));
    if(grouped)supersetNo++;
    unit.forEach((row,memberIndex)=>{
      order++;
      row.order_index=order;
      row.exercise_no=grouped?`${unitIndex+1}${supersetMemberCode(memberIndex)}`:String(unitIndex+1);
      row.group_label=grouped?`Superseria ${supersetNo}`:null;
    });
  });
  const changed=rows.some(row=>before.get(row.id)!==JSON.stringify([row.order_index,row.exercise_no,row.superset_key,row.group_label]));
  return {rows:units.flat(),changed,legacyMigrated};
}

function syncProgressionOrderFromTraining(){
  if(!STATE.progressionExercises.length)return false;
  const rank=new Map();
  let index=0;
  [...STATE.trainings]
    .sort((a,b)=>(Number(a.order_index)||0)-(Number(b.order_index)||0))
    .forEach(training=>getTrainingRows(training.id).forEach(row=>rank.set(row.id,index++)));
  let changed=false;
  STATE.blocks.forEach(block=>{
    const rows=STATE.progressionExercises
      .filter(row=>row.block_id===block.id&&!row._delete)
      .sort((a,b)=>{
        const ar=rank.has(a.training_exercise_id)?rank.get(a.training_exercise_id):Number.MAX_SAFE_INTEGER;
        const br=rank.has(b.training_exercise_id)?rank.get(b.training_exercise_id):Number.MAX_SAFE_INTEGER;
        return ar-br||(Number(a.order_index)||0)-(Number(b.order_index)||0)||String(a.id).localeCompare(String(b.id));
      });
    rows.forEach((row,rowIndex)=>{
      const next=rowIndex+1;
      if(Number(row.order_index)!==next){row.order_index=next;changed=true}
    });
  });
  return changed;
}

function normalizeTrainingStructure(trainingId,{detectLegacy=false,syncProgression=true}={}){
  const result=normalizeExerciseRows(STATE.trainingExercises.filter(row=>row.training_id===trainingId),{detectLegacy});
  if(syncProgression&&syncProgressionOrderFromTraining())result.changed=true;
  return result;
}

function normalizeAllTrainingStructures({detectLegacy=false}={}){
  let changed=false,legacyMigrated=false;
  STATE.trainings.forEach(training=>{
    const result=normalizeTrainingStructure(training.id,{detectLegacy,syncProgression:false});
    changed=changed||result.changed;
    legacyMigrated=legacyMigrated||result.legacyMigrated;
  });
  changed=syncProgressionOrderFromTraining()||changed;
  return {changed,legacyMigrated};
}

function applyTrainingExerciseOrder(trainingId,orderedRows){
  orderedRows.forEach((row,index)=>{row.order_index=index+1});
  normalizeTrainingStructure(trainingId);
  markDirty();
  render();
}

function moveTrainingExercise(id,direction){
  const row=STATE.trainingExercises.find(item=>item.id===id);
  if(!row)return;
  const rows=getTrainingRows(row.training_id),rowIndex=rows.findIndex(item=>item.id===id);
  const neighborIndex=rowIndex+(direction<0?-1:1);
  if(neighborIndex<0||neighborIndex>=rows.length)return;
  const neighbor=rows[neighborIndex];
  if(supersetKey(row)&&supersetKey(row)===supersetKey(neighbor)){
    [rows[rowIndex],rows[neighborIndex]]=[rows[neighborIndex],rows[rowIndex]];
    applyTrainingExerciseOrder(row.training_id,rows);
    return;
  }
  const units=exerciseUnits(rows);
  const sourceIndex=units.findIndex(unit=>unit.some(item=>item.id===id));
  const targetIndex=sourceIndex+(direction<0?-1:1);
  if(sourceIndex<0||targetIndex<0||targetIndex>=units.length)return;
  [units[sourceIndex],units[targetIndex]]=[units[targetIndex],units[sourceIndex]];
  applyTrainingExerciseOrder(row.training_id,units.flat());
}

function beginExerciseDrag(event,id){

function showExerciseDropTarget(event){
  if(!STATE.draggedExerciseId)return;
  event.preventDefault();
  event.dataTransfer.dropEffect="move";
  document.querySelectorAll(".exerciseGrid.dropBefore,.exerciseGrid.dropAfter").forEach(element=>element.classList.remove("dropBefore","dropAfter"));
  const after=event.clientY>event.currentTarget.getBoundingClientRect().top+event.currentTarget.offsetHeight/2;
  event.currentTarget.classList.add(after?"dropAfter":"dropBefore");
}

function finishExerciseDrag(){
  STATE.draggedExerciseId=null;
  document.querySelectorAll(".exerciseGrid.dragging,.exerciseGrid.dropBefore,.exerciseGrid.dropAfter").forEach(element=>element.classList.remove("dragging","dropBefore","dropAfter"));
}

function dropTrainingExercise(event,targetId){
  event.preventDefault();
  const draggedId=event.dataTransfer.getData("text/plain")||STATE.draggedExerciseId;
  const after=event.currentTarget.classList.contains("dropAfter");
  const dragged=STATE.trainingExercises.find(row=>row.id===draggedId);
  const target=STATE.trainingExercises.find(row=>row.id===targetId);
  finishExerciseDrag();
  if(!dragged||!target||dragged.id===target.id||dragged.training_id!==target.training_id)return;
  const rows=getTrainingRows(dragged.training_id);
  if(supersetKey(dragged)&&supersetKey(dragged)===supersetKey(target)){
    const reordered=rows.filter(row=>row.id!==dragged.id);
    const targetIndex=reordered.findIndex(row=>row.id===target.id);
    reordered.splice(targetIndex+(after?1:0),0,dragged);
    applyTrainingExerciseOrder(dragged.training_id,reordered);
    return;
  }
  const units=exerciseUnits(rows);
  const sourceUnit=units.find(unit=>unit.some(row=>row.id===dragged.id));
  const targetUnit=units.find(unit=>unit.some(row=>row.id===target.id));
  if(!sourceUnit||!targetUnit||sourceUnit===targetUnit)return;
  const reordered=units.filter(unit=>unit!==sourceUnit);
  const targetIndex=reordered.indexOf(targetUnit);
  reordered.splice(targetIndex+(after?1:0),0,sourceUnit);
  applyTrainingExerciseOrder(dragged.training_id,reordered.flat());
}

function selectedSupersetRows(trainingId){

function supersetKeysForRows(rows){
  const keys=[];
  rows.forEach(row=>{
    const key=supersetKey(row);
    if(key&&!keys.includes(key))keys.push(key);
  });
  return keys;
}

function supersetDisplayLabel(row,rows){
  const key=supersetKey(row);
  const index=supersetKeysForRows(rows).indexOf(key);
  return `Superseria ${index>=0?index+1:1}`;
}

function supersetMemberLabel(row,rows){
  const key=supersetKey(row);
  const grouped=rows.filter(item=>supersetKey(item)===key);
  const index=grouped.findIndex(item=>item.id===row.id);
  return supersetMemberCode(Math.max(0,index));
}

function toggleSupersetSelection(id,checked){

function clearSupersetSelection(trainingId){

  Object.keys(STATE.supersetSelection||{}).forEach(id=>{if(ids.has(id))delete STATE.supersetSelection[id]});
}

function nextSupersetKey(rows){
  const used=new Set(rows.map(supersetKey).filter(Boolean));
  let number=1;
  while(used.has(`ss${number}`))number++;
  return `ss${number}`;
}

function connectSelectedSuperset(trainingId){
  const rows=getTrainingRows(trainingId),selected=selectedSupersetRows(trainingId);
  if(selected.length<2){showToast("Zaznacz co najmniej dwa ćwiczenia");return}
  if(selected.some(row=>(row.mode||"sets")!=="sets")){showToast("Superseria może zawierać tylko ćwiczenia typu sets");return}
  if(selected.some(row=>supersetKey(row))){showToast("Najpierw rozłącz zaznaczone ćwiczenia");return}
  const selectedIds=new Set(selected.map(row=>row.id));
  const firstIndex=Math.min(...selected.map(row=>rows.findIndex(item=>item.id===row.id)));
  const selectedInOrder=rows.filter(row=>selectedIds.has(row.id));
  const remaining=rows.filter(row=>!selectedIds.has(row.id));
  remaining.splice(firstIndex,0,...selectedInOrder);
  remaining.forEach((row,index)=>{row.order_index=index+1});
  const key=nextSupersetKey(rows);
  selectedInOrder.forEach(row=>{row.superset_key=key});
  normalizeTrainingStructure(trainingId);
  clearSupersetSelection(trainingId);
  markDirty();
  showToast(`Połączono ${selectedInOrder.length} ćwiczenia`);
  render();
}

function disconnectSelectedSuperset(trainingId){
  const rows=getTrainingRows(trainingId),selected=selectedSupersetRows(trainingId);
  const keys=new Set(selected.map(supersetKey).filter(Boolean));
  if(!keys.size){showToast("Zaznacz ćwiczenie należące do superserii");return}
  rows.forEach(row=>{
    if(keys.has(supersetKey(row))){
      row.superset_key=null;
      row.group_label=null;
    }
  });
  normalizeTrainingStructure(trainingId);
  clearSupersetSelection(trainingId);
  markDirty();
  showToast(keys.size===1?"Superseria rozłączona":"Superserie rozłączone");
  render();
}

function blockWeeks(block){
  const start=Math.max(1,Number(block?.start_week)||1);
  const end=Math.max(start,Number(block?.end_week)||start);
  return Array.from({length:end-start+1},(_,i)=>start+i);
}

function workoutLogsForSession(preview,sessionDbId){
  return (preview.workoutSetLogs||[])
    .filter(l=>l.workout_session_id===sessionDbId)
    .sort((a,b)=>exerciseNoCompare(a.exercise_no,b.exercise_no)||(Number(a.set_no)||0)-(Number(b.set_no)||0)||String(a.exercise_name||"").localeCompare(String(b.exercise_name||"")));
}

function exerciseNoCompare(a,b){
  const pa=parseExerciseNo(a),pb=parseExerciseNo(b);
  return pa.n-pb.n || pa.s.localeCompare(pb.s) || pa.raw.localeCompare(pb.raw);
}

function parseExerciseNo(value){
  const raw=String(value||"").trim();
  const match=raw.match(/^(\d+)([a-z]*)/i);
  return {raw,n:match?Number(match[1]):9999,s:match?match[2].toLowerCase():raw.toLowerCase()};
}

function avgRpe(logs){
  const values=logs.map(l=>Number(l.rpe)).filter(Number.isFinite);
  if(!values.length)return "-";
  const avg=values.reduce((sum,v)=>sum+v,0)/values.length;
  return money(Math.round(avg*10)/10);
}

function shortDate(value){
  return value?String(value).slice(0,10):"-";
}

function humanDate(value){
  if(!value)return "brak daty";
  const months=["sty","lut","mar","kwi","maj","cze","lip","sie","wrz","paź","lis","gru"];
  const date=new Date(`${String(value).slice(0,10)}T12:00:00`);
  if(Number.isNaN(date.getTime()))return shortDate(value);
  return `${date.getDate()} ${months[date.getMonth()]}`;
}

function initials(name){
  return String(name||"?").split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]).join("").toUpperCase();
}

function statusMeta(status){
  const normalized=norm(status);
  if(["active","aktywny","published"].includes(normalized))return {label:"Aktywny",className:"good"};
  if(["draft","szkic"].includes(normalized))return {label:"Szkic",className:"warn"};
  if(["paused","wstrzymany"].includes(normalized))return {label:"Wstrzymany",className:"neutral"};
  if(["done","completed","zrobiony","ukonczony"].includes(normalized))return {label:"Ukończony",className:"good"};
  return {label:status||"Szkic",className:"neutral"};
}

function planAssignmentCount(planId){

function metric(value){
  return value===null||value===undefined||value===""?"-":money(value);
}

function statusLabel(status){
  const text=String(status||"").trim();
  if(text==="done")return "ukończony";
  if(text==="done_with_skips")return "częściowy";
  return text||"-";
}

function sessionStatusMeta(status){
  const text=String(status||"").trim();
  if(text==="done_with_skips")return {label:"częściowy",className:"warn"};
  if(text==="done"||text==="completed")return {label:"ukończony",className:"good"};
  return statusMeta(text);
}

function setLogChipHTML(log){

  const rpe=metric(log.rpe);
  const performance=[kg!=="-"?`${esc(kg)} kg`:"",reps&&reps!=="-"?`×${esc(reps)}`:""].filter(Boolean).join(" ");
  const main=performance||esc(log.planned_label||"wykonano");
  return `<span>${main}${rpe!=="-"?` <b>RPE ${esc(rpe)}</b>`:""}</span>`;
}

function previewWeekNotes(preview,week){
  const blocks=preview.blocks.filter(b=>Number(b.start_week)<=Number(week)&&Number(b.end_week)>=Number(week));
  return preview.weekNotes.filter(n=>Number(n.week_number)===Number(week)&&blocks.some(b=>b.id===n.block_id)).map(n=>n.notes).filter(Boolean).join("; ");
}

  const source=getCurrentPlan();
  if(!source)return;
  if(STATE.dirty){
    alert("Najpierw zapisz zmiany w planie, a potem go sklonuj.");
    return;
  }
  const name=prompt("Nazwa sklonowanego planu",`${source.name} — kopia`);
  if(!name||!name.trim())return;
  let newPlanId=null;
  STATE.saving=true;
  setStatus("Klonuję plan...","loading");
  render();
  try{
    const slug=`${slugify(name)}_${Date.now().toString(36)}`;
    const {data:newPlan,error:planError}=await sb.from("plans").insert({
      slug,
      name:name.trim(),
      start_date:source.start_date,
      weeks:Number(source.weeks)||1,
      status:"draft",
      notes:source.notes||null
    }).select("id").single();
    if(planError)throw planError;
    newPlanId=newPlan.id;

    const trainingIdMap=new Map();
    const trainingExerciseIdMap=new Map();
    for(const training of [...STATE.trainings].sort((a,b)=>(a.order_index||0)-(b.order_index||0))){
      const {data:newTraining,error:trainingError}=await sb.from("trainings").insert({
        plan_id:newPlanId,
        name:training.name,
        focus:training.focus||null,
        order_index:Number(training.order_index)||1
      }).select("id").single();
      if(trainingError)throw trainingError;
      trainingIdMap.set(training.id,newTraining.id);

      const oldRows=getTrainingRows(training.id);
      if(!oldRows.length)continue;
      const payload=oldRows.map(row=>({
        training_id:newTraining.id,
        exercise_id:row.exercise_id,
        exercise_no:row.exercise_no||null,
        order_index:Number(row.order_index)||1,
        sets_text:row.sets_text||null,
        reps_text:row.reps_text||null,
        rest_text:row.rest_text||null,
        weight:nullableNumber(row.weight),
        load_text:row.load_text||null,
        tempo_text:row.tempo_text||null,
        use_wg:Boolean(row.use_wg),
        progression_mode:row.progression_mode||"none",
        superset_key:row.superset_key||null,
        group_label:row.group_label||null,
        mode:row.mode||"sets",
        notes:row.notes||null,
        video_hint:row.video_hint||null,
        progression_raw:row.progression_raw||{}
      }));
      const {data:newRows,error:rowsError}=await sb.from("training_exercises").insert(payload).select("id,order_index");
      if(rowsError)throw rowsError;
      oldRows.forEach((oldRow,index)=>{
        const mapped=newRows[index]||newRows.find(row=>Number(row.order_index)===Number(oldRow.order_index));
        if(mapped)trainingExerciseIdMap.set(oldRow.id,mapped.id);
      });
    }

    const blockIdMap=new Map();
    for(const block of [...STATE.blocks].sort((a,b)=>(a.block_index||0)-(b.block_index||0))){
      const {data:newBlock,error:blockError}=await sb.from("progression_blocks").insert({
        plan_id:newPlanId,
        name:block.name,
        block_index:Number(block.block_index)||1,
        start_week:Number(block.start_week)||1,
        end_week:Number(block.end_week)||Number(block.start_week)||1,
        notes:block.notes||null
      }).select("id").single();
      if(blockError)throw blockError;
      blockIdMap.set(block.id,newBlock.id);
    }

    const progressionExerciseIdMap=new Map();
    for(const block of STATE.blocks){
      const oldRows=STATE.progressionExercises.filter(row=>row.block_id===block.id&&!row._delete).sort((a,b)=>(a.order_index||0)-(b.order_index||0));
      if(!oldRows.length)continue;
      const payload=oldRows.map(row=>({
        block_id:blockIdMap.get(block.id),
        exercise_id:row.exercise_id,
        training_exercise_id:trainingExerciseIdMap.get(row.training_exercise_id)||null,
        order_index:Number(row.order_index)||1,
        notes:row.notes||null,
        source_name:row.source_name||null
      }));
      const {data:newRows,error:rowsError}=await sb.from("progression_exercises").insert(payload).select("id,order_index");
      if(rowsError)throw rowsError;
      oldRows.forEach((oldRow,index)=>{
        const mapped=newRows[index]||newRows.find(row=>Number(row.order_index)===Number(oldRow.order_index));
        if(mapped)progressionExerciseIdMap.set(oldRow.id,mapped.id);
      });
    }

    const progressionSets=STATE.progressionSets.filter(row=>!row._delete&&progressionExerciseIdMap.has(row.progression_exercise_id)).map(row=>({
      progression_exercise_id:progressionExerciseIdMap.get(row.progression_exercise_id),
      week_number:Number(row.week_number),
      set_no:Number(row.set_no),
      label:row.label||"Seria",
      reps_text:row.reps_text||null,
      kg:nullableNumber(row.kg),
      notes:row.notes||null,
      raw_text:row.raw_text||null,
      load_text:row.load_text||null,
      set_count:row.set_count||null,
      is_skip:Boolean(row.is_skip),
      is_deload:Boolean(row.is_deload),
      prescription:row.prescription||{},
      rest_text:row.rest_text||null
    }));
    await insertRowsInChunks("progression_sets",progressionSets);

    const weekNotes=STATE.weekNotes.filter(row=>String(row.notes||"").trim()&&blockIdMap.has(row.block_id)).map(row=>({
      block_id:blockIdMap.get(row.block_id),
      week_number:Number(row.week_number),
      notes:String(row.notes).trim()
    }));
    await insertRowsInChunks("progression_week_notes",weekNotes);

    const resources=STATE.resources.map(resource=>({
      plan_id:newPlanId,
      label:resource.label,
      url:resource.url||null,
      resource_type:resource.resource_type||"video",
      notes:resource.notes||null
    }));
    await insertRowsInChunks("plan_resources",resources);

    await Promise.all([loadPlans(),loadAthleteAssignments()]);
    STATE.saving=false;
    showToast("Plan sklonowany");
    await loadPlan(newPlanId);
  }catch(err){
    if(newPlanId)await sb.from("plans").delete().eq("id",newPlanId);
    STATE.saving=false;
    setError(err);
  }
}

async function deletePlan(id){
  const plan=STATE.plans.find(row=>row.id===id)||(STATE.currentPlan?.id===id?STATE.currentPlan:null);
  const name=plan?.name||"ten plan";
  const typed=prompt(`Usunięcie planu skasuje jego treningi, progresję, materiały i przypisania. Historia wykonanych sesji i pomiary pozostaną bez powiązania z planem.\n\nAby usunąć plan, wpisz dokładnie:\n${name}`);
  if(typed===null)return;
  if(typed.trim()!==String(name).trim()){
    showToast("Nazwa nie pasuje — plan nie został usunięty");
    return;
  }
  STATE.saving=true;
  setStatus("Usuwam plan...","loading");
  render();
  try{
    const {data,error}=await sb.from("plans").delete().eq("id",id).select("id");
    if(error)throw error;
    if(!data?.length)throw new Error("Plan nie został usunięty.");
    STATE.currentPlan=null;
    STATE.screen="plans";
    STATE.dirty=false;
    await Promise.all([loadPlans(),loadAthleteAssignments()]);
    STATE.saving=false;
    setStatus("Plan usunięty","ok");
    showToast("Plan usunięty");
    render();
  }catch(err){
    STATE.saving=false;
    setError(err);
  }
}

async function upsertTrainingExercisesWithStableOrder(payload){
  if(!payload.length)return;
  const ids=payload.map(row=>row.id);
  const {data:currentRows,error:readError}=await sb.from("training_exercises").select("id,order_index").in("id",ids);
  if(readError)throw readError;
  const previousOrder=new Map((currentRows||[]).map(row=>[row.id,Number(row.order_index)]));
  const orderingPayload=payload.map(row=>({
    id:row.id,
    training_id:row.training_id,
    exercise_id:row.exercise_id,
    order_index:1_000_000_000+Number(row.order_index)
  }));
  let result=await sb.from("training_exercises").upsert(orderingPayload,{onConflict:"id"});
  if(result.error)throw result.error;
  result=await sb.from("training_exercises").upsert(payload,{onConflict:"id"});
  if(result.error){
    const restorePayload=payload
      .filter(row=>previousOrder.has(row.id))
      .map(row=>({
        id:row.id,
        training_id:row.training_id,
        exercise_id:row.exercise_id,
        order_index:previousOrder.get(row.id)
      }));
    if(restorePayload.length)await sb.from("training_exercises").upsert(restorePayload,{onConflict:"id"});
    throw result.error;
  }
}

async function persistTrainingStructure(trainingId){
  const rows=getTrainingRows(trainingId);
  if(!rows.length)return;
  const payload=rows.map(row=>({
    id:row.id,
    training_id:row.training_id,
    exercise_id:row.exercise_id,
    order_index:Number(row.order_index),
    exercise_no:row.exercise_no,
    superset_key:row.superset_key||null,
    group_label:row.group_label||null
  }));
  await upsertTrainingExercisesWithStableOrder(payload);
}

async function createProgressionBlock(){
  const currentPlan=getCurrentPlan();
  if(!currentPlan)return;
  const last=[...STATE.blocks].sort((a,b)=>(Number(a.block_index)||0)-(Number(b.block_index)||0)).at(-1);
  const nextIndex=(Number(last?.block_index)||STATE.blocks.length)+1;
  const defaultStart=last?Number(last.end_week)+1:1;
  const defaultWeeks=last?4:Math.max(1,Number(currentPlan.weeks)||12);
  const name=prompt("Nazwa bloku",`BLOK ${nextIndex}`);
  if(!name||!name.trim())return;
  const start=Number(prompt("Pierwszy tydzień bloku",String(defaultStart))||defaultStart);
  const weeks=Number(prompt("Ile tygodni ma blok",String(defaultWeeks))||defaultWeeks);
  const safeStart=Math.max(1,start||defaultStart);
  const safeWeeks=Math.max(1,weeks||defaultWeeks);
  try{
    const {data,error}=await sb.from("progression_blocks").insert({plan_id:currentPlan.id,name:name.trim(),block_index:nextIndex,start_week:safeStart,end_week:safeStart+safeWeeks-1,notes:null}).select("id").single();
    if(error)throw error;
    STATE.activeBlockId=data.id;
    await loadPlan(currentPlan.id);
    STATE.activeBlockId=data.id;
    STATE.tab="progression";
    await syncProgressionExercises(data.id);
  }catch(err){setError(err);}
}

function absorbStatusSetsIntoWeekNotes(){
  for(const set of STATE.progressionSets){
    if(!isStatusLikeSet(set))continue;
    const pe=STATE.progressionExercises.find(row=>row.id===set.progression_exercise_id);
    if(!pe)continue;
    const text=statusSetText(set);
    if(text){
      let note=STATE.weekNotes.find(n=>n.block_id===pe.block_id&&Number(n.week_number)===Number(set.week_number));
      if(!note){
        note={id:tempId(),block_id:pe.block_id,week_number:set.week_number,notes:text};
        STATE.weekNotes.push(note);
      }else if(!norm(note.notes).includes(norm(text))){
        note.notes=[note.notes,text].filter(Boolean).join("; ");
      }
    }
    set._delete=true;
  }
}

async function syncProgressionExercises(blockId){
  const block=STATE.blocks.find(b=>b.id===blockId);
  if(!block)return;
  const candidates=progressionCandidates();
  if(!candidates.length){showToast("Brak ćwiczeń oznaczonych jako progresja tygodniowa");return;}
  const existingByTe=new Map(STATE.progressionExercises.filter(pe=>pe.block_id===blockId&&pe.training_exercise_id).map(pe=>[pe.training_exercise_id,pe]));
  const toCreate=candidates.filter(row=>!existingByTe.has(row.id));
  if(!toCreate.length){showToast("Ćwiczenia są już połączone");return;}
  try{
    let order=STATE.progressionExercises.filter(pe=>pe.block_id===blockId).reduce((m,pe)=>Math.max(m,Number(pe.order_index)||0),0);
    const rows=toCreate.map(row=>{
      order++;
      const ex=row.exercises||STATE.exercises.find(e=>e.id===row.exercise_id)||{};
      return {block_id:blockId,exercise_id:row.exercise_id,training_exercise_id:row.id,order_index:order,source_name:ex.name||row.source_name||null};
    });
    const {error}=await sb.from("progression_exercises").insert(rows);
    if(error)throw error;
    STATE.activeBlockId=blockId;
    await loadPlan(getCurrentPlan().id);
    STATE.activeBlockId=blockId;
    STATE.tab="progression";
    showToast("Ćwiczenia dodane do bloku");
    render();
  }catch(err){setError(err);}
}

function clonePreviousWeek(peId,week){
  const prevWeek=Number(week)-1;
  const sourceSets=STATE.progressionSets
    .filter(s=>s.progression_exercise_id===peId&&Number(s.week_number)===prevWeek&&!s._delete)
    .sort((a,b)=>(a.set_no||0)-(b.set_no||0));
  if(!sourceSets.length){showToast("Poprzedni tydzień nie ma serii");return;}
  const currentSets=STATE.progressionSets.filter(s=>s.progression_exercise_id===peId&&Number(s.week_number)===Number(week)&&!s._delete);
  if(currentSets.length&&!confirm("Ten tydzień ma już serie. Zastąpić je poprzednim tygodniem?"))return;
  for(const row of currentSets){
    if(isTempId(row.id))STATE.progressionSets=STATE.progressionSets.filter(s=>s.id!==row.id);
    else row._delete=true;
  }
  for(const source of sourceSets){
    STATE.progressionSets.push({
      ...source,
      id:tempId(),
      week_number:Number(week),
      raw_text:source.raw_text||buildProgressionSetRaw(source),
      _delete:false
    });
  }
  markDirty();
  render();
}

  STATE.progressionSets.push({...source,id:tempId(),set_no:nextSetNo(source.progression_exercise_id,source.week_number),raw_text:source.raw_text||buildProgressionSetRaw(source),_delete:false});

function updateProgressionSetField(id,field,value){
  const row=STATE.progressionSets.find(s=>s.id===id);
  if(!row)return;
  row[field]=value;
  if(field==="load_text")row.kg=parseLoadKg(value);
  markDirty();
}

function parseLoadKg(value){
  const text=String(value||"").trim().replace(/\s*kg$/i,"").replace(",",".");
  return /^-?\d+(?:\.\d+)?$/.test(text)?Number(text):null;
}

function buildProgressionSetRaw(s){
  const label=String(s.label||"").trim();
  const labelNorm=norm(label);
  const hasStructuredText=String(s.load_text||"").trim()||String(s.reps_text||"").trim()||String(s.rest_text||"").trim()||s.kg!==null&&s.kg!==undefined;
  if(s.raw_text&&!hasStructuredText&&(!label||labelNorm==="seria"||labelNorm==="plan tygodnia"))return s.raw_text;
  const load=String(s.load_text||money(s.kg)||"").trim();
  const reps=String(s.reps_text||"").trim();
  const main=[load,reps].filter(Boolean).join("/");
  if(label&&labelNorm!=="seria"&&main)return `${label} ${main}`;
  return main||label||"";
}

function progressionSetPayload(s){
  const label=String(s.label||"Seria").trim()||"Seria";
  const raw=buildProgressionSetRaw({...s,label});
  const loadText=String(s.load_text||money(s.kg)||"").trim();
  const kg=parseLoadKg(loadText);
  return {
    label,
    reps_text:String(s.reps_text||"").trim()||null,
    kg,
    load_text:loadText||null,
    rest_text:String(s.rest_text||"").trim()||null,
    raw_text:raw||null,
    set_count:null,
    is_skip:false,
    is_deload:false,
    notes:s.notes||null,
    prescription:{source:"manual_series_builder",shape:"block_week_exercise_series"}
  };
}

  return `<div class="clientExercise">

function progressionPreviewFor(preview,row,week){
  const mode=row.progression_mode==="manual_weight"?"prescribed_weight":(row.progression_mode||"none");
  const blocks=preview.blocks.filter(b=>Number(b.start_week)<=Number(week)&&Number(b.end_week)>=Number(week));
  const pe=preview.progressionExercises.find(x=>x.training_exercise_id===row.id&&blocks.some(b=>b.id===x.block_id));
  if(!pe){
    return mode!=="none"||row.use_wg?`<div class="rxLine"><span class="rxPill gold">brak rozpiski na tydzień ${week}</span></div>`:"";
  }
  const sets=preview.progressionSets.filter(s=>s.progression_exercise_id===pe.id&&Number(s.week_number)===Number(week)).sort((a,b)=>(a.set_no||0)-(b.set_no||0));
  if(!sets.length)return `<div class="rxLine"><span class="rxPill gold">brak serii na tydzień ${week}</span></div>`;
  return `<div class="rxLine">${sets.map(s=>`<span class="rxPill">${esc(formatProgressionSet(s))}</span>`).join("")}</div>`;
}

function formatProgressionSet(s){
  const load=s.load_text||((s.kg!==null&&s.kg!==undefined)?`${money(s.kg)}kg`:"");
  const reps=s.reps_text||"";
  const rest=s.rest_text?` · ${s.rest_text}`:"";
  return `${s.set_no}. ${[load,reps].filter(Boolean).join(" / ")}${rest}`.trim();
}

async function assignExistingPlanToAthlete(athleteId){
  const planId=document.getElementById(`assignPlan_${athleteId}`)?.value;
  if(!planId){showToast("Wybierz plan");return;}
  try{
    const {error}=await sb.from("plan_athletes").upsert({plan_id:planId,athlete_id:athleteId},{onConflict:"plan_id,athlete_id"});
    if(error)throw error;
    await loadAthleteAssignments();
    showToast("Plan przypisany");
    render();
  }catch(err){setError(err);}
}

async function unassignPlanFromAthlete(athleteId,planId){
  if(!confirm("Odpiąć plan od podopiecznego? Sam plan nie zostanie usunięty."))return;
  try{
    const {error}=await sb.from("plan_athletes").delete().eq("athlete_id",athleteId).eq("plan_id",planId);
    if(error)throw error;
    if(STATE.athletePreview?.athleteId===athleteId&&STATE.athletePreview?.plan?.id===planId)STATE.athletePreview=null;
    await loadAthleteAssignments();
    showToast("Plan odpięty");
    render();
  }catch(err){setError(err);}
}

async function loadAthletePreview(athleteId,planId){
  setStatus("Ładuję podgląd klienta...","loading");render();
  try{
    let plan=STATE.plans.find(p=>p.id===planId)||STATE.athletePlanLinks.find(x=>x.plan_id===planId)?.plans||null;
    if(!plan){
      const res=await sb.from("plans").select("id,slug,name,start_date,weeks,status,notes,created_at,published_at").eq("id",planId).single();
      if(res.error)throw res.error;plan=res.data;
    }
    const [tr,blocks,sessionsRes,measurementsRes]=await Promise.all([
      sb.from("trainings").select("id,plan_id,name,focus,order_index").eq("plan_id",planId).order("order_index"),
      sb.from("progression_blocks").select("id,plan_id,name,block_index,start_week,end_week,notes").eq("plan_id",planId).order("block_index"),
      sb.from("workout_sessions").select("id,athlete_id,plan_id,source_plan_key,client_key,session_id,workout_date,performed_date,week_number,workout_id,workout_name,status,completed_exercises,total_exercises,session_note,recorded_at").eq("athlete_id",athleteId).eq("plan_id",planId).order("workout_date",{ascending:false}),
      sb.from("athlete_measurements").select("id,athlete_id,plan_id,source_plan_key,client_key,measurement_date,week_number,waga,udo,dupa,brzuch,klatka,biceps,szyja,recorded_at").eq("athlete_id",athleteId).eq("plan_id",planId).order("measurement_date",{ascending:false})
    ]);
    if(tr.error)throw tr.error;if(blocks.error)throw blocks.error;if(sessionsRes.error)throw sessionsRes.error;if(measurementsRes.error)throw measurementsRes.error;
    const trainings=tr.data||[];
    const workoutSessions=sessionsRes.data||[];
    const measurements=measurementsRes.data||[];
    const trainingIds=trainings.map(t=>t.id);
    let trainingExercises=[];
    if(trainingIds.length){
      const te=await sb.from("training_exercises").select("id,training_id,exercise_id,exercise_no,order_index,sets_text,reps_text,rest_text,weight,load_text,tempo_text,use_wg,progression_mode,superset_key,mode,notes,exercises(id,name,youtube_url)").in("training_id",trainingIds).order("order_index");
      if(te.error)throw te.error;trainingExercises=te.data||[];
      trainings.forEach(training=>normalizeExerciseRows(trainingExercises.filter(row=>row.training_id===training.id),{detectLegacy:true}));
    }
    const blockIds=(blocks.data||[]).map(b=>b.id);
    let progressionExercises=[],progressionSets=[],weekNotes=[];
    if(blockIds.length){
      const [pe,wn]=await Promise.all([
        sb.from("progression_exercises").select("id,block_id,exercise_id,training_exercise_id,order_index,source_name").in("block_id",blockIds).order("order_index"),
        sb.from("progression_week_notes").select("id,block_id,week_number,notes").in("block_id",blockIds).order("week_number")
      ]);
      if(pe.error)throw pe.error;if(wn.error)throw wn.error;
      progressionExercises=pe.data||[];weekNotes=wn.data||[];
      const peIds=progressionExercises.map(x=>x.id);
      if(peIds.length){
        const ps=await sb.from("progression_sets").select("id,progression_exercise_id,week_number,set_no,label,reps_text,kg,raw_text,load_text,set_count,is_skip,is_deload,rest_text,notes").in("progression_exercise_id",peIds).order("week_number");
        if(ps.error)throw ps.error;progressionSets=ps.data||[];
      }
    }
    let workoutSetLogs=[];
    const workoutSessionIds=workoutSessions.map(s=>s.id);
    if(workoutSessionIds.length){
      const logs=await sb.from("workout_set_logs").select("id,workout_session_id,athlete_id,plan_id,source_plan_key,client_key,session_id,exercise_no,exercise_name,set_no,planned_label,kg,reps_text,rpe,done,note,recorded_at").in("workout_session_id",workoutSessionIds).order("session_id").order("set_no");
      if(logs.error)throw logs.error;
      workoutSetLogs=logs.data||[];
    }
    STATE.selectedAthleteId=athleteId;
    STATE.selectedWorkoutSessionId=workoutSessions[0]?.id||null;
    STATE.previewWeek=1;
    STATE.athletePreview={athleteId,plan,trainings,trainingExercises,blocks:blocks.data||[],progressionExercises,progressionSets,weekNotes,workoutSessions,workoutSetLogs,measurements};
    setStatus("Podgląd klienta załadowany","ok");
    render();
  }catch(err){setError(err);}
}

function renderExercises(){
  const categories=[...new Set(STATE.exercises.map(e=>e.default_category).filter(Boolean))].sort();
  const query=norm(STATE.exerciseQuery);
  const exercises=STATE.exercises.filter(e=>{
    const matchesQuery=!query||norm(`${e.name} ${e.default_category} ${e.notes}`).includes(query);
    const matchesCategory=STATE.exerciseCategory==="all"||e.default_category===STATE.exerciseCategory;
    return matchesQuery&&matchesCategory;
  });
  document.getElementById("main").innerHTML=`
    <div class="topbar studioTopbar">
      <div><div class="eyebrow">Biblioteka</div><div class="title">Rejestr ćwiczeń</div><div class="screenMeta">${STATE.exercises.length} ćwiczeń</div>${statusHTML()}</div>
      <div class="topbarActions"><div class="searchField"><span>⌕</span><input value="${esc(STATE.exerciseQuery)}" placeholder="Szukaj ćwiczenia…" oninput="STATE.exerciseQuery=this.value;renderExercises()"></div><button class="btn good" onclick="saveExercises()">Zapisz zmiany</button></div>
    </div>
    <div class="filterPills"><button class="filterPill ${STATE.exerciseCategory==="all"?"active":""}" onclick="STATE.exerciseCategory='all';renderExercises()">Wszystkie</button>${categories.map(category=>`<button class="filterPill ${STATE.exerciseCategory===category?"active":""}" onclick="STATE.exerciseCategory='${esc(category)}';renderExercises()">${esc(category)}</button>`).join("")}</div>
    <div class="section registrySection"><div class="tableWrap"><table class="registryTable"><thead><tr><th>Ćwiczenie</th><th>Kategoria</th><th>Tryb</th><th>Wideo</th><th>Notatki</th><th></th></tr></thead><tbody>${exercises.map(e=>`<tr><td><input class="registryName" value="${esc(e.name)}" oninput="updateExercise('${e.id}','name',this.value)"></td><td><input value="${esc(e.default_category||"")}" oninput="updateExercise('${e.id}','default_category',this.value)"></td><td><select onchange="updateExercise('${e.id}','default_mode',this.value)"><option value="sets" ${e.default_mode==="sets"?"selected":""}>serie</option><option value="time" ${e.default_mode==="time"?"selected":""}>czas</option><option value="done" ${e.default_mode==="done"?"selected":""}>wykonanie</option></select></td><td><input value="${esc(e.youtube_url||"")}" placeholder="YouTube ↗" oninput="updateExercise('${e.id}','youtube_url',this.value)"></td><td><input value="${esc(e.notes||"")}" oninput="updateExercise('${e.id}','notes',this.value)"></td><td><button class="deleteX" onclick="deleteExercise('${e.id}')">×</button></td></tr>`).join("")}</tbody></table></div><div class="addBar registryAdd"><input id="newExerciseName" placeholder="Nazwa nowego ćwiczenia"><button class="btn secondary" onclick="createExerciseFromRegistry()">+ Dodaj</button></div></div>`;
}
async function createExerciseFromRegistry(){
  const name=document.getElementById("newExerciseName").value.trim();
  if(!name)return;
  try{const {error}=await sb.from("exercises").insert({name,default_mode:"sets",default_category:"accessory"});if(error)throw error;await loadExercises();render();}catch(err){setError(err);}
}
async function deleteExercise(id){
  if(!confirm("Ukryć ćwiczenie z registry? Stare plany zachowają nazwę i historię."))return;
  try{
    const {error}=await sb.from("exercises").update({archived_at:new Date().toISOString(),archived_reason:"ukryte z registry"}).eq("id",id);
    if(error)throw error;
    await loadExercises();
    showToast("Ćwiczenie ukryte z registry");
    render();
  }catch(err){setError(err);}
}

/* =========================
   SAVE
========================= */
async function savePlan(){
  const currentPlan=getCurrentPlan();
  if(!currentPlan)return;
  normalizeAllTrainingStructures({detectLegacy:true});
  STATE.saving=true;setStatus("Zapisuję plan...","loading");render();
  try{
    const p=currentPlan;
    let res=await sb.from("plans").update({name:p.name,start_date:p.start_date,weeks:Number(p.weeks),status:p.status,notes:p.notes||null}).eq("id",p.id);
    if(res.error)throw res.error;
    for(const t of STATE.trainings){
      res=await sb.from("trainings").update({name:t.name,focus:t.focus||null,order_index:Number(t.order_index)}).eq("id",t.id);
      if(res.error)throw res.error;
    }
    const trainingExercisePayload=STATE.trainingExercises.map(r=>{
      const pMode=r.progression_mode==="manual_weight"?"prescribed_weight":(r.progression_mode||"none");
      return {id:r.id,training_id:r.training_id,exercise_id:r.exercise_id,exercise_no:r.exercise_no||null,order_index:Number(r.order_index),sets_text:r.sets_text||null,reps_text:r.reps_text||null,rest_text:r.rest_text||null,weight:pMode==="prescribed_weight"?null:nullableNumber(r.weight),load_text:r.load_text||null,tempo_text:r.tempo_text||null,use_wg:pMode==="prescribed_weight",progression_mode:pMode,superset_key:r.superset_key||null,group_label:r.group_label||null,mode:r.mode||"sets",notes:r.notes||null,video_hint:r.video_hint||null};
    });
    if(trainingExercisePayload.length){
      await upsertTrainingExercisesWithStableOrder(trainingExercisePayload);
    }
    const progressionExercisePayload=STATE.progressionExercises.filter(row=>!row._delete&&!isTempId(row.id)).map(row=>({
      id:row.id,
      block_id:row.block_id,
      exercise_id:row.exercise_id,
      training_exercise_id:row.training_exercise_id||null,
      order_index:Number(row.order_index)||1,
      notes:row.notes||null,
      source_name:row.source_name||null
    }));
    if(progressionExercisePayload.length){
      res=await sb.from("progression_exercises").upsert(progressionExercisePayload,{onConflict:"id"});
      if(res.error)throw res.error;
    }
    for(const r of STATE.resources){
      res=await sb.from("plan_resources").update({label:r.label,url:r.url||null,resource_type:r.resource_type||"video",notes:r.notes||null}).eq("id",r.id);
      if(res.error)throw res.error;
    }
    STATE.dirty=false;setStatus("Zapisano plan","ok");showToast("Plan zapisany");await loadPlans();await loadPlan(p.id);
  }catch(err){setError(err);}
  finally{STATE.saving=false;render();}
}

async function saveProgressionGrid(){
  const activeId=STATE.activeBlockId;
  STATE.saving=true;setStatus("Zapisuję progresję...","loading");render();
  try{
    const deletedProgressionExerciseIds=new Set(STATE.progressionExercises.filter(row=>row._delete).map(row=>row.id));
    for(const block of STATE.blocks){
      const payload={name:block.name||"BLOK",block_index:Number(block.block_index)||1,start_week:Number(block.start_week)||1,end_week:Math.max(Number(block.start_week)||1,Number(block.end_week)||1),notes:block.notes||null};
      const {error}=await sb.from("progression_blocks").update(payload).eq("id",block.id);
      if(error)throw error;
    }
    for(const note of STATE.weekNotes){
      const text=String(note.notes||"").trim();
      if(!text){
        if(!isTempId(note.id)){
          const {error}=await sb.from("progression_week_notes").delete().eq("id",note.id);
          if(error)throw error;
        }
        continue;
      }
      const {error}=await sb.from("progression_week_notes").upsert({
        block_id:note.block_id,
        week_number:Number(note.week_number),
        notes:text,
        updated_at:new Date().toISOString()
      },{onConflict:"block_id,week_number"});
      if(error)throw error;
    }
    for(const s of STATE.progressionSets.filter(row=>(row._delete||deletedProgressionExerciseIds.has(row.progression_exercise_id))&&!isTempId(row.id))){
      const {error}=await sb.from("progression_sets").delete().eq("id",s.id);
      if(error)throw error;
    }
    for(const pe of STATE.progressionExercises.filter(row=>row._delete&&!isTempId(row.id))){
      const {error}=await sb.from("progression_exercises").delete().eq("id",pe.id);
      if(error)throw error;
    }
    for(const s of STATE.progressionSets.filter(row=>!row._delete&&!deletedProgressionExerciseIds.has(row.progression_exercise_id))){
      const payload=progressionSetPayload(s);
      if(isTempId(s.id)){
        const {error}=await sb.from("progression_sets").insert({...payload,progression_exercise_id:s.progression_exercise_id,week_number:Number(s.week_number),set_no:Number(s.set_no)});
        if(error)throw error;
      }else{
        const {error}=await sb.from("progression_sets").update({...payload,set_no:Number(s.set_no)}).eq("id",s.id);
        if(error)throw error;
      }
    }
    STATE.dirty=false;setStatus("Progresja zapisana","ok");showToast("Progresja zapisana");
    STATE.activeBlockId=activeId;
    await loadPlan(STATE.currentPlan.id);
    STATE.activeBlockId=activeId;
    STATE.tab="progression";
    render();
  }catch(err){setError(err);}
  finally{STATE.saving=false;render();}
}

async function saveAthletes(){
  try{
    for(const athlete of STATE.athletes){
      if(!athlete.name||!athlete.client_key)continue;
      const {error}=await sb.from("athletes").update({name:athlete.name.trim(),client_key:slugify(athlete.client_key),status:athlete.status||"active",notes:athlete.notes||null}).eq("id",athlete.id);
      if(error)throw error;
    }
    await Promise.all([loadAthletes(),loadAthleteAssignments()]);
    STATE.dirty=false;setStatus("Podopieczni zapisani","ok");showToast("Podopieczni zapisani");render();
  }catch(err){setError(err);}
}

async function saveExercises(){
  try{
    for(const e of STATE.exercises){
      if(!e.name||!e.name.trim())continue;
      const {error}=await sb.from("exercises").update({name:e.name.trim(),youtube_url:e.youtube_url||null,notes:e.notes||null,default_mode:e.default_mode||"sets",default_category:e.default_category||null}).eq("id",e.id);
      if(error)throw error;
    }
    await loadExercises();STATE.dirty=false;setStatus("Registry zapisane","ok");render();
  }catch(err){setError(err);}
}

init();
</script>
